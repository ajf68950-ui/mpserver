name: Muntly
version: '${project.version}'
main: muntly.Muntly
api-version: '26.2'
description: Eigen munt (Munten) met speeltijd- en dagbeloning, muntenwinkel en lootboxen, ook te gebruiken via de website.
softdepend: [Vault, PlaceholderAPI, Vaulty]
commands:
  munten:
    description: Je Munten, de muntenwinkel en de lootboxen.
    usage: /munten [saldo | winkel | lootbox | top | dagelijks | geef | pak | zet | herladen]
    aliases: [munt, muntly]
permissions:
  muntly.use:
    description: Munten verdienen en uitgeven.
    default: true
  muntly.admin:
    description: Munten geven, afpakken en instellen, config herladen.
    default: op
