# Lootboxen. Bij elke beloning staat een kans (gewicht): hoe hoger, hoe vaker.
# Het percentage wordt uitgerekend uit alle kansen samen. Beloningen:
#   munten: 20                        Munten
#   geld: 5000                        gewoon geld (via Vault)
#   item: stormzwaard                 een item uit de lijst hierboven
#   materiaal: diamond, aantal: 16    een gewoon Minecraft-item
lootboxen:
  muntenkist:
    naam: '&e&lMuntenkist'
    icoon: chest
    prijs: 40
    beschrijving: 'Voor elke dag: grondstoffen, Munten terug en soms een speciaal item.'
    beloningen:
      - {kans: 22, munten: 20}
      - {kans: 7, munten: 70}
      - {kans: 16, materiaal: diamond, aantal: 16}
      - {kans: 10, materiaal: netherite_ingot, aantal: 2}
      - {kans: 12, materiaal: golden_apple, aantal: 8}
      - {kans: 12, materiaal: experience_bottle, aantal: 32}
      - {kans: 8, geld: 25000}
      - {kans: 3, materiaal: enchanted_golden_apple, aantal: 1}
      - {kans: 2, item: tuinschep}
      - {kans: 2, item: visserslijn}
      - {kans: 1.5, item: wachtershelm}
      - {kans: 1.5, item: wachterspoot}
      - {kans: 1, item: wachtersbeen}
      - {kans: 1, item: wachtersborst}
      - {kans: 1, item: stormzwaard}
  drakenkist:
    naam: '&5&lDrakenkist'
    icoon: ender_chest
    prijs: 150
    beschrijving: 'De kist met de beste spullen, en als enige met legendarische items.'
    beloningen:
      - {kans: 18, munten: 100}
      - {kans: 4, munten: 300}
      - {kans: 14, materiaal: netherite_ingot, aantal: 4}
      - {kans: 10, materiaal: enchanted_golden_apple, aantal: 2}
      - {kans: 8, materiaal: totem_of_undying, aantal: 1}
      - {kans: 8, geld: 150000}
      - {kans: 5, item: drakenhelm}
      - {kans: 5, item: drakenborst}
      - {kans: 5, item: drakenbeen}
      - {kans: 5, item: drakenpoot}
      - {kans: 4, item: stormzwaard}
      - {kans: 4, item: diepgraver}
      - {kans: 3, item: aardschokhamer}
      - {kans: 4, item: hemelvleugels}
      - {kans: 1, item: koningskroon}
      - {kans: 1, item: eeuwig-stormzwaard}
      - {kans: 1, item: oogstzeis}
