# Muntly - muntenwinkel en lootboxen.
# Na het aanpassen: /munten herladen.
#
# Een item:
#   prijs: wat het kost in Munten (weglaten of alleen-lootbox: true = niet te koop, alleen uit een lootbox)
#   categorie: wapens, gereedschap, armor of overig (bepaalt de volgorde in de winkel)
#   materiaal: Minecraft-naam, bijv. netherite_sword
#   naam / lore: met kleurcodes (&6 = goud, &l = vet)
#   enchants: naam: niveau (mag hoger dan normaal, bijv. sharpness: 6)
#   trim: { materiaal: gold, patroon: silence }   (alleen armor)
#   kleur: '#RRGGBB'                              (alleen leren armor)
#   onbreekbaar: true
#   zeldzaamheid: gewoon, zeldzaam, episch of legendarisch (kleur van de naam als er geen kleur in staat)

items:
  # ------------------------------------------------------------ wapens
  stormzwaard:
    prijs: 400
    categorie: wapens
    materiaal: netherite_sword
    naam: '&b&lStormzwaard'
    lore: ['&7Snijdt door elke storm heen.']
    enchants: {sharpness: 6, sweeping_edge: 4, looting: 4, fire_aspect: 2, unbreaking: 4, mending: 1}
    zeldzaamheid: episch
