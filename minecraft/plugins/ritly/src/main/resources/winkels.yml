# Ritly winkels. Elke winkel opent via een NPC (/ritly npc maak <winkel>), een Citizens-NPC
# (/npc command add ritly winkel open <winkel> <p>) of een display in een showroom (/ritly showroom zet ...).
# Spelers kunnen een winkel niet met een commando openen.
#
# producten:
#   voertuig:<model>             een voertuig (uit modellen.yml), komt in de garage
#   onderdeel:<motor|stuur|tank>:<1-3>   een onderdeel om in te bouwen (Garage > Werkplaats)
#   lak:<kleur>                  lak (white, orange, magenta, light_blue, yellow, lime, pink, gray,
#                                light_gray, cyan, purple, blue, brown, green, red, black)
#   brandstof:<liter>            een jerrycan met brandstof
# Na het aanpassen: /ritly herladen (of in het spel /ritly winkel ...)

winkels:

  fietsenwinkel:
    titel: "&2&lFietsenwinkel"
