# Ritly modellen: elk voertuig is gemaakt van blokken (block displays).
#
# Coordinaten in blokken, vanaf het midden van het voertuig op de grond:
#   x = links (+) / rechts (-), y = omhoog, z = voorkant (+) / achterkant (-)
#
# delen: "<blok> x1 y1 z1 x2 y2 z2 [vlaggen]"  = een blok uitgerekt van hoek (x1,y1,z1) tot hoek (x2,y2,z2)
#   blok: elk Minecraft-blok, ook met eigenschappen, bijv. redstone_lamp[lit=true]
#   Witte blokken (white_...) krijgen de lakkleur van het voertuig.
#   vlaggen: draai:x  = draait rond als een wiel (met de snelheid)
#            draai:z  = draait rond als een propeller (met het gas)
#            rx:<graden> ry:<graden> rz:<graden> = schuin zetten
# zitplaatsen: [x, y, z] van de stoel (waar je zit); de eerste is de bestuurder.
# botsing: [breedte, lengte, hoogte] (optioneel, anders berekend uit de delen).
# soort: fiets, auto, boot of vliegtuig.
# max-snelheid km/u, acceleratie km/u per seconde, draaien graden per seconde,
# tank liter, verbruik liter per 1000 blokken, opstijgen km/u (vliegtuig), diepgang (boot, hoe diep in het water).

